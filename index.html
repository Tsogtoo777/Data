<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,sans-serif}
header{background:#fff;padding:10px 14px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-brand{min-width:0}
.header-logo{display:block;width:clamp(110px,22vw,190px);height:auto;max-height:56px;object-fit:contain;flex-shrink:0}
h1{margin:0;font-size:20px}
small{color:#667085}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:59px;background:#f4f7fb;z-index:4}
button{border:1px solid #dce3eb;background:#fff;border-radius:9px;padding:9px;cursor:pointer}
nav button.active{background:#0b6e69;color:#fff}
main{max-width:1100px;margin:auto;padding:0 10px 30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card,.eq,.stat{background:#fff;border:1px solid #e3e8ef;border-radius:13px;padding:12px;margin-bottom:10px}
.stat b{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.name{font-weight:800}.type{font-size:11px;color:#667085}
.current{background:#f1f5f9;border-radius:8px;padding:8px;margin:8px 0;font-size:13px}
.statuses{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.statuses button{font-size:11px;text-align:left}
.statuses button.active{background:#e6f5f3;border-color:#0b6e69;font-weight:700}
.operator-row{display:flex;gap:7px;align-items:center;margin:8px 0}
.operator-row input{flex:1}
.status-trigger{width:100%;text-align:left;font-weight:700;margin:8px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-backdrop.open{display:flex}
.modal{background:#fff;width:min(650px,100%);max-height:85vh;border-radius:18px 18px 0 0;padding:16px;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-title{font-size:18px;font-weight:800}
.modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.modal-grid button{text-align:left;padding:12px}
.modal-grid button.active{background:#e6f5f3;border-color:#0b6e69;font-weight:700}
.log{display:grid;grid-template-columns:90px 110px 120px 1fr;gap:7px;padding:8px 0;border-bottom:1px solid #eee;font-size:12px}
select,input,textarea{width:100%;padding:10px;border:1px solid #d8e0e8;border-radius:9px;font:inherit}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.form-grid label,.modal label{font-size:13px;font-weight:700}
.form-grid input,.modal textarea{display:block;font-weight:400}
.smu-note{font-size:12px;background:#fff7e6;border:1px solid #f3d08b;padding:9px;border-radius:9px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.status-chip{display:inline-block;padding:5px 8px;border-radius:8px;font-weight:700;font-size:12px}
.status-working{background:#dcfce7;color:#166534}.status-repair{background:#fee2e2;color:#991b1b}.status-electric{background:#f3e8ff;color:#7e22ce}.status-wait{background:#ffedd5;color:#9a3412}.status-shift{background:#dbeafe;color:#1d4ed8}.status-other{background:#e5e7eb;color:#374151}
.event-extra{font-size:11px;color:#667085;margin-top:3px}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}}
.primary{background:#0b6e69;color:#fff;border:0;font-weight:700}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:20}
.err{background:#fff1f1;border:1px solid #ffb4b4;padding:12px;border-radius:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.log{grid-template-columns:75px 85px 90px 1fr}.modal-grid{grid-template-columns:1fr}}

.status-working,.status-repair,.status-electric,.status-wait,.status-shift,.status-other{font-weight:700}
@media(max-width:650px){header{padding:9px 10px}.header-logo{width:clamp(88px,24vw,140px);max-height:46px}h1{font-size:18px}}
.equipment-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 16px}
.equipment-tabs button{font-weight:700;padding:12px 5px}

function showPage(page) {
  if (isReadOnlyViewer() && ['eq','production','handover','shiftReview','report'].includes(page)) page='dash';
  ["dash","eq","hour","production","report","allTimeline","shiftReview","handover"].forEach(function(id) {
    document.getElementById(id).style.display = id === page ? "block" : "none";
  });
  document.querySelectorAll("nav button").forEach(function(button) {
    button.classList.toggle("active", button.dataset.page === page);
  });
  if (page === "hour") renderHour();
  if (page === "production") renderProduction();
  if (page === "report") renderReport();
}

function renderHour() {
  const selected = document.getElementById("hourSelect");
  const hour = selected ? Number(selected.value) : new Date().getHours();
  const dateInput = document.getElementById("hourDate");
  const day = dateInput ? dateInput.value : localDateValue();
  const list = events.filter(function(event) {
    const d = new Date(event.start_time);
    return d.getHours() === hour && localDateValue(d) === day;
  });

  document.getElementById("hour").innerHTML =
    '<div class="card">' +
      '<b>Цагийн мэдээ</b><br>' +
      '<button class="primary" id="exportHour" style="margin:8px 0">📊 Excel татах</button>' +
      '<button id="exportAll" style="margin:8px 0 8px 6px">Бүх мэдээ</button>' +
      '<label style="display:block;margin:8px 0">Огноо<input id="hourDate" type="date" value="'+esc(day)+'"></label>' +
      '<select id="hourSelect">' +
        Array.from({length:24}, function(_, i) {
          return '<option value="' + i + '"' + (i === hour ? " selected" : "") + '>' +
            String(i).padStart(2,"0") + ':00 – ' + String((i+1)%24).padStart(2,"0") + ':00</option>';
        }).join("") +
      '</select>' +
    '</div>' +
    '<div class="card">' +
      (list.length ? list.map(function(event) {
        const item = equipment.find(function(x){ return String(x.id) === String(event.equipment_id); });
        return '<div class="log">' +
          '<b>' + fmt(event.start_time) + '</b>' +
          '<span>' + esc(item ? item.name : event.equipment_id) + '</span>' +
          '<span>' + esc(event.operator_name || getOperator(event.equipment_id) || "-") + '</span>' +
          '<span><span class="status-chip ' + statusClass(event.status) + '">' + esc(event.status) + '</span>' +
          ((event.smu != null || event.km != null || event.comment) ? '<div class="event-extra">' + (event.smu != null ? 'SMU: ' + esc(event.smu) + ' ' : '') + (event.km != null ? 'KM: ' + esc(event.km) + ' ' : '') + (event.comment ? '<br>📝 ' + esc(event.comment) : '') + '</div>' : '') +
          '</span>' +
        '</div>';
      }).join("") : "Энэ цагт event алга.") +
    '</div>';
}


function localDateValue(date) {
  const d = date || new Date();
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
}
function equipmentMeasure(item) {
  const label = String((item && item.name) || "") + " " + String((item && item.equipment_type) || "");
  if (/өрөм|дрилл|drill/i.test(label) || /410[- ]?0?[12]/i.test(label)) return "тууш метр";
  if (/830/i.test(label)) return "рейс";
  return "тоо";
}
function is830(item) {
  return /830/i.test(String((item && item.name) || "") + " " + String((item && item.equipment_type) || ""));
}
function isDrill(item) {
  return /өрөм|дрилл|drill/i.test(String((item && item.name) || "") + " " + String((item && item.equipment_type) || "")) || /410[- ]?0?[12]/i.test(String((item && item.name) || ""));
}

 if(!/^BL[0-9]+[A-ZА-ЯӨҮ0-9-]*$/i.test(block)||!level)return toast('Блокийг BL30 хэлбэрээр, түвшинг бөглөнө үү.');
 const old=locationFor(item.id);

 try{

 }catch(e){toast('Байршил хадгалах алдаа: '+e.message);}

const MATERIAL_TYPES = ["Хөрс", "Исэлдсэн хүдэр", "Балансын бус исэлдсэн хүдэр", "Сульфид хүдэр", "Балансын сульфид хүдэр", "Бусад", "Замын дэвсэлт", "Шимт хөрс"];
let activeProductionGroup = "truck";
function productionGroup(item){return is830(item)?"truck":isDrill(item)?"drill":null;}
function productionSlotMode(day,hour,now=new Date()){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!Number.isInteger(hour)||hour<0||hour>23)throw Error('Огноо, цагийн утга буруу байна.');
 const mnDay=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ulaanbaatar',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
 const slot=new Date(day+'T'+String(hour).padStart(2,'0')+':00:00+08:00');
 if(!Number.isFinite(slot.getTime())||mnDay(slot)!==day)throw Error('Огноо буруу байна.');
 if(slot.getTime()>now.getTime())throw Error('Ирээдүйн цагт бүтээл бүртгэхгүй.');
 return day===mnDay(now)&&hour===Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ulaanbaatar',hour:'2-digit',hourCycle:'h23'}).format(now))?'current':'historical';
}
function historicalProductionFields(day,hour,target){
 let mode;try{mode=productionSlotMode(day,hour);}catch(e){return '<p role="alert">'+esc(e.message)+'</p>';}
 // Keep location fields present when the clock passes into the next hour.
 const loc=locationFor(target?.id)||{};
 const blocks=[...new Set([...productionLogs,...blockLocations].map(x=>x.block_code).filter(Boolean))];
 const levels=[...new Set([...productionLogs,...blockLocations].map(x=>x.level_name).filter(Boolean))];
 return '<fieldset style="margin-top:12px;border:1px solid #ff6b1b;border-radius:10px;padding:12px"><legend>Ажлын байршил</legend>'+
 '<p><small>Сонгосон техникийн одоогийн байршлаас автоматаар бөглөв. Тухайн цагт өөр байршилтай байсан бол засна уу. Цаг өнгөрсөн ч дахин баталгаажуулахгүй.</small></p>'+
 '<div class="form-grid"><label>Блок<input value="'+esc(loc.block_code||'')+'" id="productionHistoricalBlock" list="productionBlockChoices" placeholder="Жишээ: BL42" autocomplete="off" maxlength="40" required></label>'+
 '<label>Түвшин<input value="'+esc(loc.level_name||'')+'" id="productionHistoricalLevel" list="productionLevelChoices" placeholder="Жишээ: 980–970" autocomplete="off" maxlength="80" required></label></div>'+
 '<datalist id="productionBlockChoices">'+blocks.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
 '<datalist id="productionLevelChoices">'+levels.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
 '<small>Энд зассан байршил зөвхөн нэмэх бүтээлд хамаарна.</small></fieldset>';
}
function syncProductionLocation(){

 const target=is830(item)?equipment.find(x=>String(x.id)===String(document.getElementById('productionDump')?.value)):item;
 const loc=locationFor(target?.id)||{};
 const block=document.getElementById('productionHistoricalBlock'),level=document.getElementById('productionHistoricalLevel');
 if(block)block.value=loc.block_code||'';if(level)level.value=loc.level_name||'';
}

function historicalProductionLocation(block,level){
 block=String(block||'').trim().toUpperCase();level=String(level||'').trim();
 if(!/^BL[0-9]+[A-ZА-ЯӨҮ0-9-]*$/i.test(block)||block.length>40||!level||level.length>80)throw Error('Тухайн үеийн блокийг BL42 хэлбэрээр, түвшинг заавал бөглөнө үү.');
 return {block_code:block,level_name:level};
}
let productionSaveBusy=false;

async function saveProductionOnce() {
  const equipmentId = document.getElementById("productionEquipment")?.value;
  const item = equipment.find(x=>String(x.id)===String(equipmentId));
  const amount = Number(document.getElementById("productionAmount")?.value);
  const day = document.getElementById("productionDate")?.value || localDateValue();
  const hour = Number(document.getElementById("productionHour")?.value);
  if (!item) return toast("Техникээ сонгоно уу.");
  if (!Number.isFinite(amount) || amount < 0 || document.getElementById("productionAmount").value === "") return toast("Бүтээлийн хэмжээг зөв оруулна уу.");
  if (is830(item) && !Number.isInteger(amount)) return toast("БелАЗ-ийн рейсийн тоо бүхэл тоо байх ёстой.");
  if (is830(item) && !document.getElementById("productionMaterial")?.value) return toast("830 техникийн материалын төрлийг сонгоно уу.");
  const holeInput = document.getElementById("productionHoleCount");
  const holeCount = holeInput && holeInput.value !== "" ? Number(holeInput.value) : null;
  if (isDrill(item) && (holeCount === null || !Number.isInteger(holeCount) || holeCount < 0)) return toast("Цооногийн тоог бүхэл тоогоор оруулна уу.");
  const locTarget=is830(item)?equipment.find(x=>String(x.id)===String(document.getElementById('productionDump')?.value)):item;
  if(is830(item)&&!locTarget)return toast('Ачуулсан экскаваторыг заавал сонгоно уу.');
  const mode=productionSlotMode(day,hour);
  if(!locationEquipment(locTarget))return toast('Байршилтай экскаватор эсвэл өрөм сонгоно уу.');
  const savedLocation=locationFor(locTarget.id)||{};
  const blockInput=document.getElementById('productionHistoricalBlock');
  const levelInput=document.getElementById('productionHistoricalLevel');
  // If an already-open form crosses an hour boundary, missing controls
  // use the configured location rather than failing historical validation.
  const block=blockInput?blockInput.value:savedLocation.block_code;
  const level=levelInput?levelInput.value:savedLocation.level_name;
  const loc=historicalProductionLocation(block,level);
  const row = {
    block_code:loc?.block_code||null, level_name:loc?.level_name||null,
    production_date: day, hour_slot: hour, equipment_id: item.id,
    measure_type: equipmentMeasure(item), amount: amount,
    hole_count: isDrill(item) ? holeCount : null,
    production_type: isDrill(item) ? (document.getElementById("productionType")?.value || "Өрмийн бүтээл") : null,
    operator_name: null,
    dump_equipment_id: is830(item) ? (document.getElementById("productionDump")?.value || null) : null,
    material_type: is830(item) ? (document.getElementById("productionMaterial")?.value || null) : null,
    comment: document.getElementById("productionComment").value.trim() || null
  };
  try {
    await api("production_logs", {method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(row)});
    toast("Бүтээлийн мэдээ хадгалагдлаа.");
    try{
      productionLogs = await api("production_logs?select=*&order=created_at.desc&limit=2000");
      renderProduction();
    }catch(refreshError){toast('Бүтээл хадгалагдсан. Жагсаалтыг ачаалж чадсангүй. Давтан нэмэхгүй, хуудсаа шинэчилж шалгана уу.');}
  } catch(e) {
    toast("Хадгалах хүсэлт алдаатай хариуллаа: "+e.message+". Дахин нэмэхээс өмнө хуудсаа шинэчилж бүртгэл орсон эсэхийг шалгана уу.");
  }
}

  '<div class="card"><b>Төлөвт зарцуулсан хугацаа (ойролцоо)</b><small>Бүртгэлийн эхлэл/төгсгөлөөр тооцсон; нээлттэй төлөв өнөөг хүртэл тооцогдоно.</small>'+(durationRows||'<p><small>Төлөвийн бүртгэл алга.</small></p>')+'</div>'+
  '<div class="card"><b>Өдрийн бүтээл</b>'+(prodRows||'<p><small>Бүтээлийн бүртгэл алга.</small></p>')+'</div>';
}
// Excel export only: sort copies, never mutate the original data arrays.
function exportEventsOldestFirst(items) {
  return [...items].sort((a,b) => new Date(a.start_time).getTime() - new Date(b.start_time).getTime());
}
function exportProductionOldestFirst(items) {
  const key=x=>{
    const day=String(x.production_date||'');
    const hour=Number(x.hour_slot);
    return day && Number.isFinite(hour) ? Date.parse(day+'T'+String(hour).padStart(2,'0')+':00:00') : Infinity;
  };
  return [...items].sort((a,b)=>key(a)-key(b));
}

function exportHour() {
  if (typeof XLSX === "undefined") {
    toast("Excel модуль ачаалагдаагүй байна.");
    return;
  }
  const select = document.getElementById("hourSelect");
  const hour = select ? Number(select.value) : new Date().getHours();
  const day = document.getElementById("hourDate")?.value || localDateValue();

  const rows = exportEventsOldestFirst(events.filter(function(event) {
    const d = new Date(event.start_time);
    return d.getHours() === hour && localDateValue(d) === day;
  })).map(function(event) {
    const item = equipment.find(function(x){ return String(x.id) === String(event.equipment_id); });
    return {
      "Огноо":new Date(event.start_time).toLocaleDateString("mn-MN"),
      "Цаг":new Date(event.start_time).toLocaleTimeString("mn-MN",{hour:"2-digit",minute:"2-digit"}),
      "Техник":item ? item.name : event.equipment_id,
      "Техникийн төрөл":item ? item.equipment_type : "",
      "Төлөв":event.status,
      "Оператор":event.operator_name || "",
      "SMU":event.smu != null ? event.smu : "",
      "KM":event.km != null ? event.km : "",
      "Тайлбар":event.comment || ""
    };
  });

  const productionRows = exportProductionOldestFirst(productionLogs.filter(function(x) {
    return x.production_date === day && Number(x.hour_slot) === hour;
  })).map(function(x) {
    const item = equipment.find(function(e){ return String(e.id) === String(x.equipment_id); });
    const dump = equipment.find(function(e){ return String(e.id) === String(x.dump_equipment_id); });
    return {
      "Огноо": x.production_date,

      "Цооногийн тоо": x.hole_count ?? "",

      "Нэгж": x.measure_type || "",
      "Материалын төрөл": x.material_type || "",
      "Ачуулсан экскаватор": dump ? dump.name : (x.dump_equipment_id || ""),
      "Тайлбар": x.comment || ""
    };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{"Мэдээлэл":"Сонгосон цагт төлөвийн мэдээ алга"}]), "Цагийн мэдээ");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(productionRows.length ? productionRows : [{"Мэдээлэл":"Сонгосон цагт бүтээлийн мэдээ алга"}]), "Бүтээлийн мэдээ");
  XLSX.writeFile(wb, "Data_Event_" + day + "_" + String(hour).padStart(2,"0") + "00.xlsx");
}

    toast("Excel модуль ачаалагдаагүй байна.");
    return;
  }

  const rows = exportEventsOldestFirst(events).map(function(event) {
    const item = equipment.find(function(x){ return String(x.id) === String(event.equipment_id); });
    return {
      "Огноо":new Date(event.start_time).toLocaleDateString("mn-MN"),
      "Эхэлсэн цаг":new Date(event.start_time).toLocaleString("mn-MN"),
      "Дууссан цаг":event.end_time ? new Date(event.end_time).toLocaleString("mn-MN") : "",
      "Техник":item ? item.name : event.equipment_id,
      "Техникийн төрөл":item ? item.equipment_type : "",
      "Төлөв":event.status,
      "Оператор":event.operator_name || "",
      "SMU":event.smu != null ? event.smu : "",
      "KM":event.km != null ? event.km : "",
      "Тайлбар":event.comment || ""
    };
  });

  const current = equipment.map(function(item) {
    return {
      "Техник":item.name,
      "Техникийн төрөл":item.equipment_type || "",
      "Одоогийн төлөв":item.current_status || "Нөөцөнд зогссон"
    };
  });

  const productionRows = exportProductionOldestFirst(productionLogs).map(function(x) {
    const item = equipment.find(function(e){ return String(e.id) === String(x.equipment_id); });
    const dump = equipment.find(function(e){ return String(e.id) === String(x.dump_equipment_id); });
    return {
      "Огноо": x.production_date || "",
      "Цаг": x.hour_slot != null ? String(x.hour_slot).padStart(2,"0") + ":00" : "",
      "Техник": item ? item.name : (x.equipment_name || x.equipment_id),
      "Ажлын төрөл": x.production_type || "",
      "Цооногийн тоо": x.hole_count ?? "",
      "Бүтээл": x.amount ?? "",
      "Нэгж": x.measure_type || "",
      "Материалын төрөл": x.material_type || "",
      "Ачуулсан экскаватор": dump ? dump.name : (x.dump_equipment_id || ""),
      "Тайлбар": x.comment || ""
    };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{"Мэдээлэл":"Төлөвийн мэдээ алга"}]), "Бүх мэдээ");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(current), "Одоогийн төлөв");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(productionRows.length ? productionRows : [{"Мэдээлэл":"Бүтээлийн мэдээ алга"}]), "Бүтээлийн мэдээ");
  XLSX.writeFile(wb, "Data_Event_Buh_Medee.xlsx");
}

document.addEventListener("click", async function(event) {
  const pageButton = event.target.closest("nav button[data-page]");
  if (pageButton) {
    showPage(pageButton.dataset.page);
    return;
  }

  const openButton = event.target.closest("[data-open-status]");
  if (openButton) {
    openStatusModal(openButton.dataset.openStatus);
    return;
  }

  const categoryButton = event.target.closest("[data-status-category]");
  if (categoryButton && selectedEquipmentId !== null) {
    showStatusCategory(Number(categoryButton.dataset.statusCategory));
    return;
  }
  if (event.target.closest("[data-back-categories]")) {
    showStatusCategories();
    return;
  }

  const modalStatus = event.target.closest("[data-modal-status]");
  if (modalStatus && selectedEquipmentId !== null) {
    chooseStatus(modalStatus.dataset.modalStatus);
    return;
  }

  if (event.target.id === "backToStatuses") {
    document.getElementById("eventDetailStep").style.display = "none";
    document.getElementById("statusStep").style.display = "block";
    return;
  }

  if (event.target.id === "saveEvent" && selectedEquipmentId !== null && selectedStatus) {
    setStatus(selectedEquipmentId, selectedStatus, {
      comment: document.getElementById("eventComment").value,
      smu: document.getElementById("eventSmu").value,
      km: document.getElementById("eventKm").value
    });
    return;
  }

  const clearButton = event.target.closest("[data-clear-operator-id]");
  if (clearButton) {
    await clearOperator(clearButton.dataset.clearOperatorId);
    return;
  }

  if (event.target.id === "closeModal" || event.target.id === "statusModal") {
    closeStatusModal();
    return;
  }


  if (event.target.id === "exportHour") {
    exportHour();
    return;
  }

  if (event.target.id === "exportAll") {
    exportAll();
    return;
  }
  const changeLocation = event.target.closest('[data-change-block]');
  if (changeLocation) { changeBlock(changeLocation.dataset.changeBlock); return; }
  if (event.target.id === "confirmBlockChange") { changeBlock(); return; }
  const prodGroup = event.target.closest("[data-production-group]");
  if (prodGroup) { activeProductionGroup=prodGroup.dataset.productionGroup; renderProduction(); return; }
  if (event.target.id === "saveProduction") { saveProduction(); return; }
  if (event.target.id === "exportDailyReport") { exportDailyReport(); return; }
});

 const [lo,hi]=bounds(day,shift),issues=[],result=[],excluded=[],seen=new Set();if(hi>now)issues.push('Сонгосон ээлж дуусаагүй байна. Бүтэн 720 минутын файл гаргахгүй.');
 const headerMap=new Map();for(const [col,name]of Object.entries(template.headers)){const k=statusKey(name);if(headerMap.has(k))issues.push('Давхардсан төлвийн багана: '+name);headerMap.set(k,col);}
 const mapped=new Set();for(const tr of template.rows){const key=equipmentKey(tr.name),matches=equipment.filter(e=>norm(e.name)===norm(tr.name)||(key&&equipmentKey(e.name)===key));
  if(matches.length!==1){issues.push(tr.name+': DATA техник '+(matches.length?'давхардсан':'олдоогүй'));continue;}const eq=matches[0];if(mapped.has(String(eq.id))){issues.push(tr.name+': нэг DATA техник хоёр мөрт таарсан');continue;}mapped.add(String(eq.id));

   if(e.operator_name?.trim())operators.set(e.operator_name.trim(),(operators.get(e.operator_name.trim())||0)+duration);else if(k===statusKey('Б Бүтээлтэй'))issues.push(tr.name+': бүтээлтэй мөрийн оператор дутуу');
  }

<script>(function(root){'use strict';
function clean(v){let s=String(v??'').replace(/[\t\r\n]+/g,' ');return /^[=+@-]/.test(s)?"'"+s:s;}
function stamp(ms){return new Date(ms+8*3600000).toISOString().slice(0,19).replace('T',' ');}
function link(day,equipment,id){const q=new URLSearchParams({date:day,equipment:String(equipment)});if(id!=null)q.set('event',String(id));return 'https://data-event-edit.vercel.app/?'+q;}
function build({day,shift,equipment,events,now=Date.now(),catalog,timeline,operatorOptional=()=>false}){
 const [lo,hi]=timeline.bounds(day,shift),asOf=Math.min(hi,now),complete=hi<=now,issues=[],idle=[],repair=[],checks=[];const categories=new Map(catalog.flatMap(c=>c.statuses.map(s=>[s,c.key]))),ids=new Set();
 const issue=(eq,type,text,id)=>issues.push({equipment_id:eq.id,equipment:eq.name,type,text,id,url:link(day,eq.id,id)});
 for(const eq of equipment){const rows=events.filter(e=>String(e.equipment_id)===String(eq.id));const t=timeline.timeline(rows,eq.id,day,shift,now);let missing=0;
  for(const e of rows){const a=Date.parse(e.start_time),b=e.end_time==null?asOf:Date.parse(e.end_time);if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a){issue(eq,'invalid','Цаг буруу',e.id);continue;}if(a>=asOf||b<=lo)continue;if(e.id==null||String(e.id)===''){issue(eq,'invalid','Бүртгэлийн ID дутуу');continue;}const key=String(e.id);if(ids.has(key)){issue(eq,'invalid','Давхардсан ID',e.id);continue;}ids.add(key);
   const start=Math.max(lo,a),end=Math.min(asOf,b);if(end<=start)continue;
   if(!operatorOptional(e.status)&&(!String(e.operator_name||'').trim()||String(e.operator_name).trim()==='.')){missing++;issue(eq,'operator','Оператор дутуу',e.id);}
   const kind=categories.get(e.status);if(!kind){issue(eq,'unknown','Ангилаагүй төлөв: '+String(e.status||''),e.id);continue;}
   const row={day,shift,equipment:eq.name,operator:e.operator_name||'',status:String(e.status||'').split('|')[0].trim(),smu:e.smu??'',comment:e.comment||'',start,end,open:e.end_time==null,id:e.id};
   if(['ready','normative','operating'].includes(kind)&&e.status!=='Ээлж солилцох | ЭЦС')idle.push(row);
   if(['planned','repair','supply'].includes(kind))repair.push(row);
  }
  let gap=0,overlap=0;for(const s of t.segments){if(s.type==='gap'){gap+=s.minutes;issue(eq,'gap',stamp(s.start)+' – '+stamp(s.end)+' · '+s.minutes.toFixed(2)+' мин завсар');}if(s.type==='overlap'){overlap+=s.minutes;issue(eq,'overlap',stamp(s.start)+' – '+stamp(s.end)+' · '+s.minutes.toFixed(2)+' мин давхардал',s.rows[0]?.id);}}
  checks.push({equipment:eq.name,equipment_id:eq.id,recorded:t.recordedMinutes,gap,overlap,missing,expected:Math.max(0,(asOf-lo)/60000),ok:complete&&gap===0&&overlap===0&&!issues.some(i=>String(i.equipment_id)===String(eq.id))});
 }
 for(const rows of [idle,repair])rows.sort((a,b)=>a.start-b.start||a.equipment.localeCompare(b.equipment,'mn',{numeric:true}));
 return {day,shift,lo,hi,asOf,complete,idle,repair,issues,checks,blocked:issues.some(i=>['invalid','overlap','unknown'].includes(i.type))};
}
function tsv(report,type){return report[type].map(r=>{const start=Math.floor(r.start/1000)*1000,end=Math.floor(r.end/1000)*1000,hours=((end-start)/3600000).toFixed(6);const cells=[r.day,r.shift,r.equipment,r.operator];if(type==='repair')cells.push(r.smu,r.status,r.comment,'');else cells.push(r.status);cells.push(stamp(start),stamp(end),hours);if(type==='idle')cells.push(r.comment);return cells.map(clean).join('\t');}).join('\r\n');}

<script>(function(root){'use strict';const roles=new Set(['event_editor','master','dispatcher','management','admin']);

root.ETSHandoverCore={canWrite,permissions,slot,changed};

<script>
(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.Weekly24Core=api;})(globalThis,function(){
'use strict';
const GROUPS={work:'Бүтээлтэй',ready:'Бэлэн байдалд',normative:'Норматив',operating:'Ашиглалтаас шалтгаалсан',planned:'Төлөвлөгөөт засвар',repair:'Эвдрэл гэмтэл',supply:'Сэлбэг хангамж',external:'Гадны нөлөөлөл'};
const normalize=v=>String(v??'').normalize('NFKC').split('|')[0].trim().toLowerCase().replace(/\s+/g,' ');
function bounds(day){
 if(!/^2026-\d{2}-\d{2}$/.test(day))throw Error('Weekly_dashboard_V2 нь 2026 оны загвар. 2026 оны огноо сонгоно уу.');
 const lo=Date.parse(day+'T07:00:00+08:00');
 if(!Number.isFinite(lo)||new Date(lo+8*3600000).toISOString().slice(0,10)!==day)throw Error('Огноо буруу.');
 return [lo,lo+86400000];
}
function targetRow(day){bounds(day);return 5+Math.round((Date.parse(day+'T00:00Z')-Date.parse('2026-01-01T00:00Z'))/86400000)*16;}
function week(day){bounds(day);return day<='2026-01-02'?1:Math.floor((Date.parse(day+'T00:00Z')-Date.parse('2026-01-03T00:00Z'))/604800000)+2;}
function calculate({day,names,equipment,events,categories,equipmentKey,norm,now=Date.now()}){
 const [lo,hi]=bounds(day),issues=[],rows=[],details=[],mapped=new Set(),ids=new Set(),lookup=new Map();
 if(hi>now)throw Error('Энэ 24 цаг дуусаагүй байна. Өмнөх дууссан хоногоо сонгоно уу.');
 if(names.length!==16||new Set(names.map(norm)).size!==16)throw Error('Weekly загварын 16 техникийн дараалал буруу.');
 for(const cat of categories)for(const s of cat.statuses){const key=normalize(s);if(lookup.has(key))throw Error('Төлвийн ангилал давхардсан: '+s);lookup.set(key,cat.key);}
 for(const name of names){
  const key=equipmentKey(name),matches=equipment.filter(e=>norm(e.name)===norm(name)||(key&&equipmentKey(e.name)===key));
  if(matches.length!==1){issues.push(name+': DATA дээр техник '+(matches.length?'давхардсан.':'олдоогүй.'));continue;}
  const eq=matches[0],eid=String(eq.id);if(mapped.has(eid)){issues.push(name+': нэг техник хоёр мөртэй таарч байна.');continue;}mapped.add(eid);
  const segments=[];
  for(const event of events){
   if(String(event.equipment_id)!==eid)continue;
   const a=Date.parse(event.start_time),b=event.end_time==null?hi:Date.parse(event.end_time);
   if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a){issues.push(name+': цаг буруу, ID '+event.id);continue;}
   if(a<hi&&b>lo)segments.push({...event,a:Math.max(a,lo),b:Math.min(b,hi)});
  }
  segments.sort((a,b)=>a.a-b.a||String(a.id).localeCompare(String(b.id)));
  let cursor=lo;const hours=Object.fromEntries(Object.keys(GROUPS).map(k=>[k,0]));
  for(const e of segments){
   if(e.id==null||ids.has(String(e.id))){issues.push(name+': бүртгэлийн ID дутуу/давхардсан '+e.id);continue;}ids.add(String(e.id));
   if(e.a>cursor+1)issues.push(name+': '+((e.a-cursor)/60000).toFixed(2)+' минут бүртгэлгүй.');
   if(e.a<cursor-1)issues.push(name+': төлөв давхардсан, ID '+e.id);
   cursor=Math.max(cursor,e.b);
   const group=lookup.get(normalize(e.status));if(!GROUPS[group]){issues.push(name+': ангилаагүй төлөв «'+e.status+'».');continue;}
   const duration=(e.b-e.a)/3600000;hours[group]+=duration;
   details.push({id:String(e.id),equipment_id:eid,name,status:e.status,group,groupName:GROUPS[group],start:e.a,end:e.b,hours:duration});
  }
  if(cursor<hi-1)issues.push(name+': төгсгөлд '+((hi-cursor)/60000).toFixed(2)+' минут бүртгэлгүй.');
  const total=Object.values(hours).reduce((a,b)=>a+b,0);
  if(Math.abs(total-24)>1e-7)issues.push(name+': нийлбэр '+total.toFixed(6)+' цаг; 24 цаг байх ёстой.');
  rows.push({name,equipment_id:eid,hours,calendar:24,plannedAvailable:24-hours.planned,repairTotal:hours.repair+hours.supply,available:24-hours.planned-hours.repair-hours.supply});
 }
 return {day,lo,hi,rows,details,week:week(day),targetRow:targetRow(day),issues:[...new Set(issues)],ok:!issues.length,excluded:equipment.filter(e=>!mapped.has(String(e.id))).map(e=>e.name)};
}
return {GROUPS,normalize,bounds,week,targetRow,calculate};
});

<script>
(function(){'use strict';
const W=Weekly24Core,C=ErpExportCore,CFG=window.WEEKLY24_CONFIG;
let busy=false,message='',issues=[],selected=new Date(Date.now()+3600000-86400000).toISOString().slice(0,10);
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const serial=ms=>(ms+8*3600000)/86400000+25569;
const normalizeXML=xml=>xml.replace(/(<\/?)(?:x:)/g,'$1').replace(/xmlns:x=/g,'xmlns=');
function stamp(ms){return new Date(ms+8*3600000).toISOString().slice(0,19).replace('T',' ');}
function cell(address,value,style,formula){
 const base='<c r="'+address+'"'+(style?' s="'+style+'"':'');
 if(typeof value==='number'){if(!Number.isFinite(value))throw Error('Excel тоо буруу: '+address);return base+'>'+(formula?'<f>'+escape(formula)+'</f>':'')+'<v>'+value+'</v></c>';}
 return base+' t="inlineStr"><is><t xml:space="preserve">'+escape(value)+'</t></is></c>';
}
function replaceCell(xml,address,value,formula){
 const re=new RegExp('<c\\b([^>]*\\br="'+address+'"[^>]*?)(?:\\/>|>[\\s\\S]*?<\\/c>)'),m=xml.match(re);
 if(m)return xml.replace(re,()=>cell(address,value,m[1].match(/\bs="([^"]+)"/)?.[1],formula));
 const row=address.match(/\d+$/)[0],rr=new RegExp('(<row\\b[^>]*\\br="'+row+'"[^>]*>)([\\s\\S]*?)(</row>)'),rm=xml.match(rr);
 if(!rm)throw Error('Excel загварт мөр алга: '+row);
 const col=a=>[...a.replace(/\d+$/,'')].reduce((n,c)=>n*26+c.charCodeAt(0)-64,0),next=[...rm[2].matchAll(/<c\b[^>]*\br="([A-Z]+\d+)"/g)].find(x=>col(x[1])>col(address)),at=next?next.index:rm[2].length;
 return xml.replace(rr,()=>rm[1]+rm[2].slice(0,at)+cell(address,value,null,formula)+rm[2].slice(at)+rm[3]);
}
async function makeWorkbook(report){
 if(!report.ok)throw Error('Зөрүүтэй мэдээг экспортлохгүй.');
 const zip=await JSZip.loadAsync(CFG.template,{base64:true});
 let main=normalizeXML(await zip.file('xl/worksheets/sheet1.xml').async('string')),detail=normalizeXML(await zip.file('xl/worksheets/sheet2.xml').async('string'));
 const detailDoc=new DOMParser().parseFromString(detail,'application/xml');
 const sample=[...detailDoc.getElementsByTagName('row')].find(r=>r.getAttribute('r')==='5');
 if(!sample)throw Error('Дэлгэрэнгүй загварын мөр олдсонгүй.');
 const styles={};for(const c of sample.getElementsByTagName('c'))styles[c.getAttribute('r').replace(/\d+$/,'')]=c.getAttribute('s');
 const rows=report.details.map((e,i)=>{const n=i+5,values=[e.id,e.name,e.status,e.groupName,serial(e.start),serial(e.end),e.hours,e.equipment_id];return '<row r="'+n+'" ht="48" customHeight="1">'+values.map((v,j)=>cell(String.fromCharCode(65+j)+n,v,styles[String.fromCharCode(65+j)])).join('')+'</row>';}).join('');
 const last=report.details.length+4;
 // Replace the reserved sample rows; never append duplicate row addresses.
 detail=detail.replace(/<row\b[^>]*\br="(\d+)"[^>]*(?:\/>|>[\s\S]*?<\/row>)/g,(all,n)=>Number(n)>=5?'':all).replace('</sheetData>',rows+'</sheetData>');
 detail=detail.replace(/<dimension\b[^>]*\/>/,'<dimension ref="A1:H'+last+'"/>');
 main=replaceCell(main,'B2','24 цагийн мэдээ · '+report.day);
 main=replaceCell(main,'B3',stamp(report.lo)+' – '+stamp(report.hi)+' · Хуулах E5:O20 → эх Excel E'+report.targetRow+':O'+(report.targetRow+15));
 const groupColumns={F:'ready',G:'planned',H:'normative',J:'repair',L:'supply',M:'operating',N:'external',O:'work'};
 for(let i=0;i<report.rows.length;i++){
  const r=report.rows[i],n=i+5;
  main=replaceCell(main,'B'+n,report.week);main=replaceCell(main,'C'+n,Date.parse(report.day+'T00:00:00Z')/86400000+25569);main=replaceCell(main,'D'+n,r.name);main=replaceCell(main,'E'+n,24);
  for(const [col,key]of Object.entries(groupColumns)){
   const f="SUMIFS('Төлөвийн дэлгэрэнгүй'!$G$5:$G$"+last+",'Төлөвийн дэлгэрэнгүй'!$B$5:$B$"+last+",$D"+n+",'Төлөвийн дэлгэрэнгүй'!$D$5:$D$"+last+',"'+W.GROUPS[key]+'")';
   main=replaceCell(main,col+n,r.hours[key],f);
  }
  const repairFormula="SUMIFS('Төлөвийн дэлгэрэнгүй'!$G$5:$G$"+last+",'Төлөвийн дэлгэрэнгүй'!$B$5:$B$"+last+",$D"+n+",'Төлөвийн дэлгэрэнгүй'!$D$5:$D$"+last+',"'+W.GROUPS.repair+'")+L'+n;
  main=replaceCell(main,'J'+n,r.repairTotal,repairFormula);
  main=replaceCell(main,'I'+n,r.plannedAvailable,'E'+n+'-G'+n);main=replaceCell(main,'K'+n,r.available,'I'+n+'-J'+n);
 }

<script>
// Daily Report: additional independent repair and operating stoppage export.
(function(){
'use strict';
const $=id=>document.getElementById(id);
const localDay=()=>new Date(Date.now()+8*3600000).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const serial=ms=>ms/86400000+25569;
// Read ONLY the exact cell, not adjacent cells or formula caches in other columns.
// The old regex crossed self-closing <c .../> elements and mistakenly treated every blank row as occupied.
function exactCell(row,col,n){
 const r=col+n;
 const re=new RegExp('<c\\b(?=[^>]*\\br="'+r+'")[^>]*?(?:\\/\\s*>|>[\\s\\S]*?<\\/c>)');
 return re.exec(row)?.[0]||'';
}
function occupiedCell(token){
 return /<v>[^<]+<\/v>/.test(token)||/<t(?:\s[^>]*)?>[^<]+<\/t>/.test(token)||/<f(?:\s|>)/.test(token);
}
function cell(row,col,n,value){
 const r=col+n,old=exactCell(row,col,n);
 // The user's workbook has styled input cells in every row. Fail closed on changed templates.
 if(!old)throw Error('Загварын нүд олдсонгүй: '+r);
 if(/<f(?:\s|>)/.test(old))throw Error('Томьёотой нүдийг өөрчлөхгүй: '+r);
 const style=(/\bs="([^"]+)"/.exec(old.split('>')[0])||[])[1];
 const base='<c r="'+r+'"'+(style?' s="'+style+'"':'');
 const out=typeof value==='number'?base+'><v>'+value+'</v></c>':base+' t="inlineStr"><is><t xml:space="preserve">'+esc(value)+'</t></is></c>';
 return row.replace(old,out);
}
function replaceRows(xml,data,fields,sheet){
 let offset=0, lastUsed=3;
 const rowPattern=/<row\b[^>]*\br="(\d+)"[^>]*>[\s\S]*?<\/row>/g;
 // Append after existing records. Some templates have blank holes among historical records.
 const inputCols=sheet==='Засварын зогсолт'?['A','B','C','D','E','F','G','H','I','J']:['A','B','C','D','E','F','G','I'];
 xml.replace(rowPattern,(row,id)=>{
  const n=Number(id);
  if(n>=4&&inputCols.some(col=>occupiedCell(exactCell(row,col,n))))lastUsed=Math.max(lastUsed,n);
  return row;
 });
 xml=xml.replace(rowPattern,(row,id)=>{
  const n=Number(id);if(n<=lastUsed||offset>=data.length)return row;
  // Only check input columns: K (repair) and H (operating) have pre-existing formulas.
  if(inputCols.some(col=>occupiedCell(exactCell(row,col,n))))return row;
  const entry=data[offset];
  let changed=row;
  const values=fields(entry);
  for(const [col,val] of Object.entries(values))if(val!==null&&val!==undefined&&val!=='')changed=cell(changed,col,n,val);
  if(sheet==='Засварын зогсолт'){
   const expected=String(values.H||'').trim();
   if(!expected)throw Error('ERP эвдрэлийн шалтгаан дутуу: '+n+'-р мөр');
   const written=exactCell(changed,'H',n);
   if(!written.includes('<t xml:space="preserve">'+esc(expected)+'</t>'))
     throw Error('H'+n+' баганад ERP төлөв бичигдсэнгүй. Экспорт зогслоо.');
  }
  offset++;
  return changed;
 });

async function targetPath(zip,name){

async function run(){const root=$('drStopsPanel'),msg=$('drStopsMsg'),btn=$('drStopsExport');btn.disabled=true;

     .filter(m=>/<t(?:\s[^>]*)?>[^<]+<\/t>/.test(m[0]));
  if(hCells.length<groups.repair.length)throw Error('Шалгалт амжилтгүй: ERP эвдрэлийн шалтгаан бүрэн бичигдээгүй.');
  if(!confirm(day+' · '+shift+'\nЗасвар: '+rep.count+' мөр\nАшиглалт: '+ops.count+' мөр\n\nХоосон мөрүүдэд нэмнэ. Хугацааны томьёог хадгална; эх Excel файлыг өөрчлөхгүй. Татах уу?'))return;
  zip.file(repPath,rep.xml);zip.file(opsPath,ops.xml);
  // Request an Excel recalculation so the existing duration formulas update from new start/end dates.
  const wbXml=await zip.file('xl/workbook.xml')?.async('string');
  if(wbXml){
   const calc=/<calcPr\b[^>]*\/?>/;
   const updated=calc.test(wbXml)?wbXml.replace(calc,tag=>{
     let x=tag.replace(/\s(?:fullCalcOnLoad|forceFullCalc|calcMode)="[^"]*"/g,'');
     return x.replace(/\/?>$/,' fullCalcOnLoad="1" forceFullCalc="1" calcMode="auto"/>');
   }):wbXml.replace('</workbook>','<calcPr fullCalcOnLoad="1" forceFullCalc="1" calcMode="auto"/></workbook>');
   zip.file('xl/workbook.xml',updated);
  }
  const output=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),url=URL.createObjectURL(output),a=document.createElement('a');a.href=url;a.download='Daily_Report_'+day+'_'+(shift==='өдөр'?'DAY':'NIGHT')+'_STOPS_H_VERIFIED.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
  msg.textContent='H баганын ERP төлөв шалгагдсан. Бэлэн: засвар '+rep.count+', ашиглалт '+ops.count+' мөр. Мото цаг, бусад sheet-ийг өөрчлөөгүй.'+(warnings.length?' Анхааруулга: '+warnings.join('; '):'');
 }catch(e){msg.textContent='Алдаа: '+e.message;}finally{btn.disabled=false;}}
function init(){
  // Keep this panel OUTSIDE #report: Data Event renderReport() replaces
  // #report.innerHTML whenever the report page or report date is rendered.
  // A sibling is stable across those renders and does not affect old exports.
  const report=$('report');
  if(!report || $('drStopsPanel'))return;
  const sec=document.createElement('section');
  sec.id='drStopsPanel';
  sec.className='card';
  sec.style.display='none';
  sec.innerHTML='<h3>Daily Report · Засварын / Ашиглалтын зогсолт · H багана шалгадаг v3</h3>'+
    '<p><small>Data Event-ийн сонгосон ээлжийн засварын болон ашиглалтын зогсолтыг Excel-ийн тус тусын sheet-д оруулна. Өмнөх импорт, ERP Daily, «Мэдээ» хэсгийг өөрчлөхгүй.</small></p>'+
    '<div class="form-grid"><label>Огноо<input type="date" id="drStopsDate" value="'+localDay()+'"></label><label>Ээлж<select id="drStopsShift"><option value="өдөр">Өдөр 07:00–19:00</option><option value="шөнө">Шөнө 19:00–07:00</option></select></label></div>'+
    '<p><label>Daily_Report_2026 Main.xlsx загвар<input type="file" id="drStopsTemplate" accept=".xlsx"></label></p>'+
    '<button class="primary" type="button" id="drStopsExport">Засвар + Ашиглалтын зогсолт Excel татах</button>'+
    '<p id="drStopsMsg" role="status" aria-live="polite"></p>';
  report.parentNode.insertBefore(sec,report);
  const sync=()=>{sec.style.display=(report.style.display==='none')?'none':'block';};
  new MutationObserver(sync).observe(report,{attributes:true,attributeFilter:['style']});
  sync();
  $('drStopsExport').addEventListener('click',run);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
